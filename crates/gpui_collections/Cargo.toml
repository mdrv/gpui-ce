[package]
name = "mdrv-gpui-collections"
version = "0.0.260925"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Blessed hash collections used by gpui-ce (vendored from Zed)."
repository = "https://github.com/gpui-ce/gpui-ce"

[lib]
name = "collections"
path = "src/collections.rs"
doctest = false

[features]
test-support = []

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
gpui_util = { package = "mdrv-gpui-util", version = "0.0.260925", path = "../gpui_ce_util" }
